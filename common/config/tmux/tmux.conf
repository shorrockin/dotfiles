# ============================================================================
# DEFAULT SHELL
# ============================================================================
# Pin explicitly rather than relying on $SHELL — whatever launched tmux (e.g.
# Omarchy's `omarchy launch terminal tmux` wraps it in `bash -c ...`) may have
# inherited a stale/wrong $SHELL, independent of the user's actual login shell.
if-shell "test -x /usr/bin/fish" "set -g default-shell /usr/bin/fish"
if-shell "test -x /opt/homebrew/bin/fish" "set -g default-shell /opt/homebrew/bin/fish"
if-shell "test -x /usr/local/bin/fish" "set -g default-shell /usr/local/bin/fish"

# ============================================================================
# PLUGIN MANAGER & PLUGINS
# ============================================================================
# Plugin manager: https://github.com/tmux-plugins/tpm
# Install plugins: prefix + I
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"

# Vim/Tmux Navigator: https://github.com/christoomey/vim-tmux-navigator
# Seamlessly navigate between tmux panes and vim splits with Ctrl+[hjkl]
set -g @plugin "christoomey/vim-tmux-navigator"

# Session Resurrect: https://github.com/tmux-plugins/tmux-resurrect
# Save: prefix + Ctrl-s | Restore: prefix + Ctrl-r
# Auto-saves every 15 minutes via continuum
set -g @plugin "tmux-plugins/tmux-resurrect"

# Continuum: https://github.com/tmux-plugins/tmux-continuum
# Auto-save every 15 minutes and restore sessions on tmux start
set -g @plugin "tmux-plugins/tmux-continuum"

# Nerd Font Window Names: https://github.com/joshmedeski/tmux-nerd-font-window-name
set -g @plugin "joshmedeski/tmux-nerd-font-window-name"

# Tmux Thumbs: https://github.com/fcsonline/tmux-thumbs
# Easy copy/paste text from tmux buffer
# Usage: prefix + space (default binding)
set -g @plugin 'fcsonline/tmux-thumbs'

# ============================================================================
# PLUGIN CONFIGURATION
# ============================================================================

# Continuum Settings
set -g @continuum-restore "on"
# set -g @continuum-boot "on" # Auto-start tmux on system boot

# Nerd Font Window Names
# Ensure window names never become blank if the plugin command returns empty.
# The plugin injects its icon output into `#{window_icon}`.
set -g automatic-rename on
# If the plugin returns an empty string, fall back to `#{pane_current_command}`.
# Otherwise use the plugin output as-is (avoids duplicate names).
set -g automatic-rename-format "#{?#{==:#{window_icon},},#{pane_current_command},#{window_icon}}"

# Thumbs Settings - copy to system clipboard (cross-platform)
if-shell 'uname | grep -q Darwin' \
  'set -g @thumbs-command "echo -n {} | pbcopy"' \
  'set -g @thumbs-command "echo -n {} | wl-copy"'

# Disable vim-tmux-navigator's C-\ binding (we use it for nested session toggle)
set -g @vim_navigator_mapping_prev ""

# ============================================================================
# TERMINAL & DISPLAY SETTINGS
# ============================================================================

# Terminal color support for both tmux and nvim
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Extended keys (distinguishes Shift+Enter from Enter)
set -as terminal-features 'xterm*:extkeys'

# Faster command sequences (better vim responsiveness)
set -sg escape-time 10

# Increase scrollback buffer
set -g history-limit 50000

# Display tmux messages for 4 seconds
set -g display-time 4000

# ============================================================================
# STATUS BAR & STYLING
# ============================================================================
# Everything here is drawn from the terminal's 16-colour ANSI palette (colour0-15)
# or `default`, never hardcoded hex. On Omarchy the palette is rewritten by
# `omarchy theme set` (via the terminal), so tmux tracks the active theme for
# free — panes, window list, and status bar all follow.

set -g status on
set -g status-interval 5
set-option -g status-position top
set -g status-justify left

# Transparent bar so Ghostty's blur/opacity shows through (see background-opacity-cells).
set -g status-style "bg=default,fg=colour7"

# Never paint an explicit pane background — let cells fall through to the
# terminal's (transparent, blurred) background instead of a darker rectangle.
# NOTE: `omarchy theme set` re-sets these to an explicit hex via
# omarchy-theme-set-tmux; the theme-set.d/10-tmux-transparent-bg hook re-asserts
# `default` afterwards so this survives a theme change.
set -g window-style "bg=default,fg=default"
set -g window-active-style "bg=default,fg=default"
set -g window-status-style "bg=default,fg=colour8,none"

# Left: session name
set -g status-left "#[fg=colour4,bold] #S #[fg=colour8]| "
set -g status-left-length 40

# Right: shortened cwd + clock
set -g status-right "#[fg=colour6]#(~/.config/scripts/short-path '#{pane_current_path}')#[fg=colour8]  |  #[fg=colour7]%H:%M "
set -g status-right-length 120

# Window list
set -g window-status-separator "  "
set -g window-status-format "#[fg=colour8]#I #W"
set -g window-status-current-format "#[fg=colour4,bold]#I #[fg=colour7,bold]#W"
set -g window-status-activity-style "fg=colour3,none"
set -g window-status-bell-style "fg=colour1,none"

# Panes
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"

# Messages / command prompt
set -g message-style "bg=colour4,fg=colour0"
set -g message-command-style "bg=colour0,fg=colour7"

# Copy-mode / clock selection
set -g mode-style "bg=colour4,fg=colour0"
set -g clock-mode-colour colour4

# Mouse support (requires tmux 2.1+)
set -g mouse on

# Focus events for nvim integration (enables tint plugin to fade inactive panes)
set -g focus-events on

# Allow passthrough for clipboard and kitty graphics protocol (for fastfetch images)
set -g allow-passthrough on

# Extended keys for CSI u / kitty keyboard protocol (enables Ctrl+digit passthrough)
set -g extended-keys on

# Native clipboard integration (tmux 2.6+)
set -g set-clipboard on

# ============================================================================
# PREFIX & BASIC OPTIONS
# ============================================================================

# Set prefix to ` instead of C-b (better ergonomics for Kinesis)
unbind C-b
set-option -g prefix `
bind ` send-prefix

# Don't detach from tmux when destroying a session; switch to next session
set-option -g detach-on-destroy off

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ============================================================================
# KEY BINDINGS - PANE & WINDOW MANAGEMENT
# ============================================================================

# Pane splitting
bind - split-window -v
bind _ split-window -h

# Quick window selection with Ctrl+[1-5]
bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4
bind-key -n C-5 select-window -t 5

# Quick window selection with Alt+[1-5]
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5

# Pane navigation (works with vim-tmux-navigator)
bind -r h select-pane -L  # Move left
bind -r j select-pane -D  # Move down
bind -r k select-pane -U  # Move up
bind -r l select-pane -R  # Move right

# Pane swapping
bind > swap-pane -D       # Swap current pane with the next one
bind < swap-pane -U       # Swap current pane with the previous one

# Pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Window navigation
bind -r S-Left select-window -t -1
bind -r S-Right select-window -t +1

# Move current window left or right
bind -r P swap-window -t -1\; select-window -t -1
bind -r N swap-window -t +1\; select-window -t +1

# ============================================================================
# KEY BINDINGS - SESSION MANAGEMENT
# ============================================================================

# Session switcher with fuzzy finder (bound to both prefix+s and Ctrl-s)
# Use bash explicitly to avoid slow fish shell startup (work config sources heavy Stripe tooling)
bind s display-popup -w 50% -h 50% -E "bash ~/.config/scripts/tmux-sessionizer"
bind-key -n C-s display-popup -w 50% -h 50% -E "bash ~/.config/scripts/tmux-sessionizer"

# Quick toggle to last session
bind-key -n C-0 switch-client -l

# ============================================================================
# KEY BINDINGS - UTILITY
# ============================================================================

# Reload configuration file
bind r source-file ~/.config/tmux/tmux.conf

# Re-enable automatic window naming
bind A setw automatic-rename on

# Refresh tmux client and clear history
bind-key -n C-b send-keys -R \; clear-history

# ============================================================================
# COPY MODE SETTINGS
# ============================================================================

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================================================
# PLUGIN MANAGER INITIALIZATION (keep at bottom)
# ============================================================================

run "~/.tmux/plugins/tpm/tpm"

# ============================================================================
# NESTED SESSION TOGGLE (must be after TPM to override plugin bindings)
# ============================================================================
# Toggle passthrough mode for nested tmux sessions (e.g., over SSH).
# When active, all keybindings forward to the inner tmux.
# C-\ to toggle. C-s and C-0 remain available for session navigation.

# Enter passthrough: disable prefix and keep the outer session visibly distinct
bind-key -T root C-\\ \
    set prefix None \;\
    set key-table off \;\
    set status 2 \;\
    set status-style "bg=default,fg=colour8" \;\
    set status-position bottom \;\
    set 'status-format[0]' "" \;\
    set 'status-format[1]' "#[align=left]#[fg=colour1,bold] REMOTE #[fg=colour8]| #[fg=colour4,bold]#S #[align=right]#[fg=colour8]C-\\ to exit passthrough " \;\
    set pane-active-border-style "fg=colour1" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S

# Exit passthrough: restore prefix and key-table (set -u falls back to globals)
bind-key -T off C-\\ \
    set -u prefix \;\
    set -u key-table \;\
    set -u status \;\
    set -u status-style \;\
    set -u status-position \;\
    set -u status-format \;\
    set -u pane-active-border-style \;\
    refresh-client -S

# Keep session navigation available in passthrough mode
bind-key -T off C-s display-popup -w 50% -h 50% -E "bash ~/.config/scripts/tmux-sessionizer"
bind-key -T off C-0 switch-client -l

# Pass through Ctrl+[1-5] window selection keys in remote mode
# Uses CSI u escape sequences (kitty keyboard protocol) for Ctrl+digit
bind-key -T off C-1 send-keys "\e[49;5u"
bind-key -T off C-2 send-keys "\e[50;5u"
bind-key -T off C-3 send-keys "\e[51;5u"
bind-key -T off C-4 send-keys "\e[52;5u"
bind-key -T off C-5 send-keys "\e[53;5u"

# Pass through Alt+[1-5] as well
bind-key -T off M-1 send-keys "\e[49;3u"
bind-key -T off M-2 send-keys "\e[50;3u"
bind-key -T off M-3 send-keys "\e[51;3u"
bind-key -T off M-4 send-keys "\e[52;3u"
bind-key -T off M-5 send-keys "\e[53;3u"
