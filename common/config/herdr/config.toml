onboarding = false

# herdr configuration
# ~/.config/herdr/config.toml
# > herdr config check && herdr server reload-config

[ui]
status_indicators = "symbols"

# Command entries run on the herdr *server* via /bin/sh -lc, so a selected devbox
# reports its own identity, not the laptop's. Only the final line of output is
# used and ESC sequences are stripped.
tab_bar_right = [
  { type = "command", command = "cat /pay/conf/box-name 2>/dev/null || echo laptop", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " | "

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "workspace"],
  ["agent"],
]

[ui.sound]
enabled = false

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "stripe.machines.open"
description = "devbox machines"

[keys]
# Match tmux's prefix (backtick instead of ctrl+b — Kinesis ergonomics)
prefix = "backtick"

# tmux binds prefix+r to reload its config. herdr's default reload_config slot is
# prefix+shift+r and prefix+r is resize_mode by default — swap them to keep the
# reload muscle memory and free up shift+r for resize.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# --- Sessions (prefix+s opens Herdr's picker; ctrl+s opens the global navigator) ---
settings = "prefix+shift+s"
goto = "ctrl+s"
workspace_picker = "prefix+s"
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
next_workspace = "prefix+0"
previous_workspace = "prefix+shift+0"

# --- Tabs / windows ---
# tmux: bare ctrl+1..5 and alt+1..5 jump directly to a window, no prefix
switch_tab = ["prefix+1..9", "ctrl+1..9", "alt+1..9"]
# tmux: bare shift+Left/Right cycle windows
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]

# --- Panes ---
split_horizontal = "prefix+minus"       # tmux: bind - (stacked split) — already the herdr default
split_vertical = "prefix+shift+minus"   # tmux: bind _ (side-by-side split)

# -- Agents ---
focus_agent = "ctrl+shift+1..9"
next_agent= "ctrl+0"
previous_agent = "ctrl+shift+0"
