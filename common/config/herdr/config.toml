onboarding = false

# herdr configuration
# ~/.config/herdr/config.toml
# > herdr config check && herdr server reload-config

[terminal]
default_shell = "fish"

[ui]
sidebar_start_collapsed = true
status_indicators = "symbols"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["machine", "agent"],
]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "stripe.machines.open"
description = "devbox machines"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "stripe.orbit.open"
description = "Orbit sessions"

[[keys.command]]
key = "ctrl+shift+o"
type = "plugin_action"
command = "stripe.orbit.open"
description = "Orbit sessions"

[[keys.command]]
key = "ctrl+s"
type = "plugin_action"
command = "stripe.picker.open"
description = "find a workspace"

[keys]
prefix = "backtick"

reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
last_pane = "prefix+0"

# Keep the global navigator available for cross-machine selection.
settings = "prefix+shift+s"
goto = ["prefix+g", "ctrl+shift+s"]
workspace_picker = "prefix+s"
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
next_workspace = "alt+tab"
previous_workspace = "alt+shift+tab"
switch_workspace = "alt+shift+1..9"

# --- Tabs / windows ---
switch_tab = ["prefix+1..9", "ctrl+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]

# --- Panes ---
split_horizontal = "prefix+minus"       
split_vertical = "prefix+shift+minus"  
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]

# -- Agents ---
focus_agent = "ctrl+shift+1..9"
next_agent= "ctrl+tab"
previous_agent = "ctrl+shift+tab"

[theme]
name = "solarized"
auto_switch = false
