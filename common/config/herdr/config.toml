onboarding = false

# herdr configuration
# ~/.config/herdr/config.toml
# > herdr config check && herdr server reload-config

[terminal]
default_shell = "fish"

[ui]
sidebar_start_collapsed = true
status_indicators = "symbols"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "agent", "workspace"],
  ["$machine"],
]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "stripe.machines.open"
description = "devbox machines"

[keys]
prefix = "backtick"

reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
last_pane = "prefix+0"

# --- Sessions (prefix+s opens Herdr's picker; ctrl+s opens the global navigator) ---
settings = "prefix+shift+s"
goto = "ctrl+s"
workspace_picker = "prefix+s"
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
next_workspace = "alt+tab"
previous_workspace = "alt+shift+tab"

# --- Tabs / windows ---
switch_tab = ["prefix+1..9", "ctrl+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]

# --- Panes ---
split_horizontal = "prefix+minus"       
split_vertical = "prefix+shift+minus"  

# -- Agents ---
focus_agent = "ctrl+shift+1..9"
next_agent= "ctrl+tab"
previous_agent = "ctrl+shift+tab"

[theme]
name = "solarized"
auto_switch = false
