gui:
 nerdFontsVersion: "3"
 showFileIcons: true
 showNumstatInFilesView: true
 expandFocusedSidePanel: true
 showDivergenceFromBaseBranch: arrowAndNumber
 scrollOffMargin: 4
 border: rounded
 filterMode: fuzzy
 switchTabsWithPanelJumpKeys: true
 showRandomTip: false
 # Use the mocha catppuccin theme
 theme:
   activeBorderColor:
     - '#89b4fa'
     - bold
   inactiveBorderColor:
     - '#a6adc8'
   optionsTextColor:
     - '#89b4fa'
   selectedLineBgColor:
     - '#313244'
   cherryPickedCommitBgColor:
     - '#45475a'
   cherryPickedCommitFgColor:
     - '#89b4fa'
   unstagedChangesColor:
     - '#f38ba8'
   defaultFgColor:
     - '#cdd6f4'
   searchingActiveBorderColor:
     - '#f9e2af'

disableStartupPopups: true

os:
 # Send clipboard writes through the terminal so they work over SSH and Herdr.
 copyToClipboardCmd: >-
   sh -c 'printf "\033]52;c;"; printf %s "$1" | base64 | tr -d "\n"; printf "\a"' sh {{text}} > /dev/tty
 # OSC 52 clipboard reads are not supported by Herdr. Keep reads working when
 # Lazygit is running directly on macOS, Wayland, or X11.
 readFromClipboardCmd: >-
   sh -c 'if command -v pbpaste >/dev/null 2>&1; then pbpaste; elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-paste >/dev/null 2>&1; then wl-paste --no-newline; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -out -selection clipboard; elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1; then xsel --output --clipboard; else exit 1; fi'

git:
 diffRenderers:
   - name: delta
     command: delta --dark --paging=never
   - name: raw
     type: rawGit
