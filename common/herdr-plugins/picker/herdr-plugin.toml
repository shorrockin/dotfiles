id = "shorrock.picker"
name = "Workspace picker"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Fuzzy search workspace names across saved machines"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Find a workspace"
contexts = ["workspace"]
command = ["node", "bin/picker.mjs", "open"]

[[panes]]
id = "picker"
title = "Workspaces"
placement = "popup"
width = "80%"
height = "70%"
command = ["node", "bin/picker.mjs", "browse"]
