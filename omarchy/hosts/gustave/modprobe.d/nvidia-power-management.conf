# Required for nvidia-hibernate/suspend/resume.service (enabled in
# setup.d/10-nvidia-hibernate.sh) to actually work. Without this, hibernation
# resume can fail with nv_pmops_freeze returning -EIO, which discards the
# hibernation image and forces a fresh boot — looks like a crash on wake.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
