# herdr configuration
# Place this file at ~/.config/herdr/config.toml

[keys]
# Match tmux's prefix (backtick instead of ctrl+b — Kinesis ergonomics, see dots/dot-tmux.conf)
prefix = "backtick"

# tmux binds prefix+r to reload ~/.tmux.conf. herdr's default reload_config slot is
# prefix+shift+r and prefix+r is resize_mode by default — swap them to keep the
# reload muscle memory and free up shift+r for resize.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# --- Sessions (tmux: prefix+s and direct ctrl+s open the session picker) ---
workspace_picker = ["prefix+s", "ctrl+s"]
# tmux: bare ctrl+0 = switch-client -l (toggle to last session)
previous_workspace = "ctrl+0"

# --- Tabs / windows ---
# tmux: bare ctrl+1..5 and alt+1..5 jump directly to a window, no prefix
switch_tab = ["prefix+1..9", "ctrl+1..9", "alt+1..9"]
# tmux: bare shift+Left/Right cycle windows
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]

# --- Panes ---
split_horizontal = "prefix+minus"       # tmux: bind - (stacked split) — already the herdr default
split_vertical = "prefix+shift+minus"   # tmux: bind _ (side-by-side split)
